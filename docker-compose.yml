services:
  proxitok:
    build: .
    container_name: proxitok-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Entries holding video URLs are namespaced per process (CDN URLs are bound to its cookies),
      # so a restart doesn't serve dead video links from Redis.
      - API_CACHE=redis
      - REDIS_HOST=proxitok-redis
      - REDIS_PORT=6379
      # - APP_URL=https://proxitok.example.com
      # - PROXY=socks5://user:password@host:port
    env_file:
      - path: .env
        required: false
    depends_on:
      - redis
    # Chromium needs more shared memory than Docker's 64M default
    shm_size: "512m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    container_name: proxitok-redis
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - proxitok-cache:/data
    security_opt:
      - no-new-privileges:true

volumes:
  proxitok-cache:
